name: Costs expenses final validation

on:
  push:
    branches:
      - feat/costs-expenses-profitability

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      - name: Verify Vercel function budget
        run: |
          count=$(find api -type f -name '*.mjs' | wc -l)
          echo "Vercel function files: $count"
          test "$count" -eq 12
          test -f 'api/expenses/[id].mjs'
          test -f 'api/selected-extras/[id].mjs'
          test -f 'api/workshops/[...path].mjs'

      - name: Relevant unit and contract tests
        run: |
          node --experimental-strip-types --test \
            artifacts/api-server/src/lib/expenses-contract.test.ts \
            artifacts/api-server/src/lib/reports-profitability.test.ts \
            artifacts/api-server/src/lib/venue-pack-cost.test.ts \
            artifacts/api-server/src/lib/reports-extras.test.ts \
            artifacts/api-server/src/lib/reports-finance.test.ts \
            artifacts/api-server/src/lib/selected-extra-cost.test.ts \
            artifacts/api-server/src/lib/selected-extra-cost-update.test.ts \
            artifacts/api-server/src/lib/selected-extra-cost-contract.test.ts \
            artifacts/api-server/src/lib/vercel-selected-extra-route.test.ts \
            artifacts/api-server/src/lib/custom-fetch-auth-contract.test.ts \
            artifacts/girafinha/src/lib/selected-extra-cost-error.test.ts

      - name: Build API and prove protected routes remain bundled
        run: |
          corepack pnpm --filter @workspace/api-server build
          grep -F '"/expenses"' artifacts/api-server/dist/app.mjs
          grep -F '"/expenses/:id"' artifacts/api-server/dist/app.mjs
          grep -F '"/settings/expense-categories"' artifacts/api-server/dist/app.mjs
          grep -F '"/selected-extras/:id"' artifacts/api-server/dist/app.mjs
          grep -F '"/workshops/:id/participants"' artifacts/api-server/dist/app.mjs
          grep -F '"/workshops/:id/participants/:participantId"' artifacts/api-server/dist/app.mjs

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Build
        run: corepack pnpm run build

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Expenses browser integration
        run: |
          PORT=4175 VITE_SUPABASE_URL=http://127.0.0.1:9999 VITE_SUPABASE_ANON_KEY=test-anon-key \
            corepack pnpm --filter @workspace/girafinha dev > /tmp/expenses-vite.log 2>&1 &
          echo $! > /tmp/expenses-vite.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4175/expenses-flow-test.html >/dev/null; then
              break
            fi
            sleep 1
          done
          corepack pnpm exec playwright test --config=playwright.expenses.config.ts
          kill $(cat /tmp/expenses-vite.pid) || true

      - name: Reports extra cost browser integration
        run: timeout 240s corepack pnpm exec playwright test --config=playwright.reports-extra-cost.config.ts
