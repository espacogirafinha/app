name: Extras costs margins validation

on:
  push:
    branches:
      - feat/extras-costs-margins-reports

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Regenerate API clients
        run: corepack pnpm --filter @workspace/api-spec codegen
      - name: Sync generated API files
        run: |
          if ! git diff --quiet -- lib/api-client-react/src/generated lib/api-zod/src; then
            git config user.name "espacogirafinha"
            git config user.email "espacogirafinha@gmail.com"
            git add lib/api-client-react/src/generated lib/api-zod/src
            git commit -m "chore: regenerate API clients"
            git push origin HEAD:feat/extras-costs-margins-reports
          fi
      - name: Relevant tests
        run: node --experimental-strip-types --test artifacts/girafinha/src/components/event-extras-selector.test.ts artifacts/api-server/src/lib/reports-extras.test.ts artifacts/api-server/src/lib/reports-finance.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
