name: Validate push API routing

on:
  push:
    branches:
      - fix/push-api-routing

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/push-api-routing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Push routing backend tests
        run: node --experimental-strip-types --test artifacts/api-server/src/routes/notifications-routing.test.ts
      - name: Existing notification backend tests
        run: |
          node --experimental-strip-types --test artifacts/api-server/src/lib/notifications.test.ts
          node --experimental-strip-types --test artifacts/api-server/src/lib/push-delivery.test.ts
          node --test tests/service-worker-notifications.test.mjs
          node --test tests/notification-scope.test.mjs
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Confirm Vercel function count
        run: |
          count=$(find api -type f -name '*.mjs' | wc -l | tr -d ' ')
          echo "Vercel function files: $count"
          test "$count" -le 12
      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Start notification UI harness
        run: |
          PORT=4176 VITE_SUPABASE_URL=https://example.supabase.co VITE_SUPABASE_ANON_KEY=test-anon \
            corepack pnpm --filter @workspace/girafinha dev > /tmp/notifications-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4176/notification-center-test.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/notifications-vite.log
          exit 1
      - name: Push activation E2E
        run: corepack pnpm exec playwright test --config=playwright.notifications.config.ts
