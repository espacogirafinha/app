name: Costs expenses validation

on:
  push:
    branches:
      - feat/costs-expenses-profitability

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: API codegen consistency
        run: |
          corepack pnpm --filter @workspace/api-spec codegen
          git restore --source=HEAD -- lib/api-zod/src/index.ts lib/api-zod/src/generated/types/workshop.ts
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src
      - name: Relevant tests
        run: |
          node --experimental-strip-types --test \
            artifacts/api-server/src/lib/venue-pack-cost.test.ts \
            artifacts/api-server/src/lib/reports-profitability.test.ts \
            artifacts/api-server/src/lib/reports-extras.test.ts \
            artifacts/api-server/src/lib/reports-finance.test.ts \
            artifacts/api-server/src/lib/event-payment-rules.test.ts \
            artifacts/girafinha/src/components/event-extras-selector.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
