name: Validate profitability copy

on:
  push:
    branches:
      - feat/clarify-profitability-copy

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Start reports test app
        run: |
          PORT=4175 VITE_SUPABASE_URL=http://127.0.0.1:9999 VITE_SUPABASE_ANON_KEY=test-anon-key \
            corepack pnpm --filter @workspace/girafinha dev > /tmp/clarify-profitability-copy-vite.log 2>&1 &
          echo $! > /tmp/clarify-profitability-copy-vite.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4175/reports-extra-cost-test.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clarify-profitability-copy-vite.log
          exit 1

      - name: Reports UI integration
        run: corepack pnpm exec playwright test --config=playwright.reports-extra-cost.config.ts

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Build
        run: corepack pnpm run build

      - name: Stop reports test app
        if: always()
        run: |
          if [ -f /tmp/clarify-profitability-copy-vite.pid ]; then kill $(cat /tmp/clarify-profitability-copy-vite.pid) || true; fi
          cat /tmp/clarify-profitability-copy-vite.log || true
