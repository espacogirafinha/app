name: Event payments 20 percent correction checks

on:
  push:
    branches:
      - feat/event-payments

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/event-payments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Regenerate OpenAPI clients and validators
        run: |
          corepack pnpm --filter @workspace/api-spec codegen
          printf 'export * from "./generated/api";\n' > lib/api-zod/src/index.ts
      - name: Verify obsolete reservation-deposit policy is absent
        shell: bash
        run: |
          obsolete_policy="auto""_30"
          if git grep -n -F "$obsolete_policy" -- .; then
            echo "Obsolete automatic reservation-deposit policy found."
            exit 1
          fi

          old_percent_pattern='30''%|30 ''percent|30 por cento|0\\.30|\\* 30\\) / 100'
          if git grep -n -E "$old_percent_pattern" -- \
            artifacts/api-server/src/lib/event-payment-rules.ts \
            artifacts/api-server/src/lib/event-payment-rules.test.ts \
            artifacts/api-server/src/lib/event-payments.ts \
            artifacts/api-server/src/routes/venue-events.ts \
            artifacts/girafinha/src/components/venue-event-modal.tsx \
            artifacts/girafinha/src/components/external-event-modal.tsx \
            artifacts/girafinha/src/lib/event-payment-ui.ts \
            artifacts/girafinha/src/lib/event-payment-ui.test.ts \
            lib/api-client-react/src/generated \
            lib/api-spec/openapi.yaml \
            lib/api-zod/src/generated \
            lib/db/src/schema/venue-events.ts \
            supabase/migrations/20260927160700_create_event_payments.sql; then
            echo "Obsolete reservation-deposit percentage reference found."
            exit 1
          fi
      - name: Backend payment tests
        run: |
          node --experimental-strip-types --test artifacts/api-server/src/lib/event-payment-rules.test.ts
          node --experimental-strip-types --test artifacts/api-server/src/lib/event-payment-creation.test.ts
      - name: Payment UI rule tests
        run: node --experimental-strip-types --test artifacts/girafinha/src/lib/event-payment-ui.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Commit regenerated API files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/api-client-react/src/generated lib/api-zod/src/generated lib/api-zod/src/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate auto 20 payment API types"
            git push origin HEAD:feat/event-payments
          fi
