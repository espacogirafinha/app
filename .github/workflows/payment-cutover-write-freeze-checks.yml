name: Payment cutover write freeze checks

on:
  push:
    branches:
      - chore/payment-cutover-write-freeze

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/payment-cutover-write-freeze
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Write-freeze tests
        run: node --experimental-strip-types --test artifacts/api-server/src/lib/payment-cutover-write-freeze.test.ts
      - name: Existing Google Forms tests
        run: node --experimental-strip-types --test artifacts/api-server/src/integrations/google-forms.test.ts artifacts/api-server/src/integrations/google-forms-review.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
