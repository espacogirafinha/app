name: Event payments 5C checks

on:
  push:
    branches:
      - feat/event-payments

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/event-payments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Google Forms tests
        run: node --experimental-strip-types --test artifacts/api-server/src/integrations/google-forms.test.ts
      - name: Payment rule tests
        run: |
          node --experimental-strip-types --test artifacts/api-server/src/lib/event-payment-rules.test.ts
          node --experimental-strip-types --test artifacts/api-server/src/lib/event-payment-creation.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
