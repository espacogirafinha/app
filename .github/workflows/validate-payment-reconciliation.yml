name: Validate payment reconciliation

on:
  push:
    branches:
      - feat/payment-reconciliation

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      - name: API codegen consistency
        run: |
          corepack pnpm --filter @workspace/api-spec codegen
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated

      - name: Payment reconciliation unit tests
        run: |
          node --experimental-strip-types --test \
            artifacts/api-server/src/lib/event-payment-rules.test.ts \
            artifacts/api-server/src/lib/payment-reconciliation.test.ts \
            artifacts/api-server/src/lib/event-payments-movements.test.ts \
            artifacts/girafinha/src/lib/financial-movements.test.ts

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Start financial movements test app
        run: |
          PORT=4175 VITE_SUPABASE_URL=http://127.0.0.1:9999 VITE_SUPABASE_ANON_KEY=test-anon-key \
            corepack pnpm --filter @workspace/girafinha dev > /tmp/payment-reconciliation-vite.log 2>&1 &
          echo $! > /tmp/payment-reconciliation-vite.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4175/financial-movements-test.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/payment-reconciliation-vite.log
          exit 1

      - name: Financial movements E2E
        run: corepack pnpm exec playwright test --config=playwright.financial-movements.config.ts

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Build
        run: corepack pnpm run build

      - name: Confirm Vercel function count
        run: |
          count=$(find api -type f -name '*.mjs' | wc -l | tr -d ' ')
          echo "Vercel function files: $count"
          test "$count" -le 12

      - name: Stop financial movements test app
        if: always()
        run: |
          if [ -f /tmp/payment-reconciliation-vite.pid ]; then kill $(cat /tmp/payment-reconciliation-vite.pid) || true; fi
          cat /tmp/payment-reconciliation-vite.log || true
