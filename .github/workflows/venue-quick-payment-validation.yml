name: Venue quick payment validation

on:
  push:
    branches:
      - feat/venue-quick-mark-paid

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Relevant tests
        run: node --experimental-strip-types --test artifacts/girafinha/src/lib/venue-quick-payment.test.ts artifacts/api-server/src/lib/event-payment-rules.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
