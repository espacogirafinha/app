name: PR63 Temporary Final Validation
on:
  push:
    branches: [feat/whatsapp-booking-confirmation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/whatsapp-booking-confirmation' || github.event.pull_request.head.ref == 'feat/whatsapp-booking-confirmation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
      - name: Install dependencies and Chromium
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec playwright install --with-deps chromium
      - name: Run required validation without early exit
        shell: bash
        run: |
          set +e
          mkdir -p validation-results
          run_check() {
            local name="$1"
            shift
            echo "::group::$name"
            "$@" >"validation-results/$name.log" 2>&1
            local status=$?
            cat "validation-results/$name.log"
            echo "$name=$status" | tee -a validation-results/status.txt
            echo "::endgroup::"
            return 0
          }
          run_check unit-whatsapp node --experimental-strip-types --test artifacts/girafinha/src/lib/booking-confirmation-whatsapp.test.ts
          run_check typecheck corepack pnpm run typecheck
          run_check build corepack pnpm run build
          (cd artifacts/girafinha && corepack pnpm exec vite --config vite.config.ts --host 127.0.0.1 --port 4175) > validation-results/vite-payments.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4175/event-payments-test.html > /dev/null && break
            sleep 2
          done
          run_check e2e-payments-whatsapp corepack pnpm exec playwright test --config=playwright.event-payments.config.ts
          run_check e2e-listing corepack pnpm exec playwright test --config=playwright.venue-events-search.config.ts
          echo "Vercel functions:" | tee validation-results/functions.txt
          find api -type f \( -name '*.ts' -o -name '*.js' \) | sort | tee -a validation-results/functions.txt
          count=$(find api -type f \( -name '*.ts' -o -name '*.js' \) | wc -l)
          echo "VERCEL_FUNCTION_COUNT=$count" | tee -a validation-results/functions.txt
          if [ "$count" -le 12 ]; then echo "function-count=0" | tee -a validation-results/status.txt; else echo "function-count=1" | tee -a validation-results/status.txt; fi
          echo "All checks status:" && cat validation-results/status.txt
          if grep -Eq '=[1-9][0-9]*$' validation-results/status.txt; then exit 1; fi
          exit 0
      - name: Preserve logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr63-final-validation
          path: |
            validation-results/
            test-results/
            playwright-report/
          if-no-files-found: ignore
