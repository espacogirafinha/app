name: Validate expense event links

on:
  push:
    branches:
      - feat/expense-event-links

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      - name: API codegen consistency
        run: |
          corepack pnpm --filter @workspace/api-spec codegen
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated

      - name: Expense and report unit tests
        run: |
          node --experimental-strip-types --test \
            artifacts/api-server/src/lib/expenses-contract.test.ts \
            artifacts/api-server/src/lib/reports-profitability.test.ts

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Start expenses test app
        run: |
          PORT=4175 VITE_SUPABASE_URL=http://127.0.0.1:9999 VITE_SUPABASE_ANON_KEY=test-anon-key \
            corepack pnpm --filter @workspace/girafinha dev > /tmp/expense-event-links-vite.log 2>&1 &
          echo $! > /tmp/expense-event-links-vite.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4175/expenses-flow-test.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/expense-event-links-vite.log
          exit 1

      - name: Expenses E2E
        run: corepack pnpm exec playwright test --config=playwright.expenses.config.ts

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Build
        run: corepack pnpm run build

      - name: Confirm Vercel function count
        run: |
          count=$(find api -type f -name '*.mjs' | wc -l | tr -d ' ')
          echo "Vercel function files: $count"
          test "$count" -le 12

      - name: Stop expenses test app
        if: always()
        run: |
          if [ -f /tmp/expense-event-links-vite.pid ]; then kill $(cat /tmp/expense-event-links-vite.pid) || true; fi
          cat /tmp/expense-event-links-vite.log || true
