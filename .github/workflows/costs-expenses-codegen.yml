name: Costs expenses codegen

on:
  push:
    branches:
      - feat/costs-expenses-profitability

permissions:
  contents: write

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Regenerate API clients
        run: |
          corepack pnpm --filter @workspace/api-spec codegen
          git restore --source=HEAD -- lib/api-zod/src/index.ts lib/api-zod/src/generated/types/workshop.ts
      - name: Commit generated files
        run: |
          if ! git diff --quiet -- lib/api-client-react/src/generated lib/api-zod/src; then
            git config user.name "espacogirafinha"
            git config user.email "espacogirafinha@gmail.com"
            git add lib/api-client-react/src/generated lib/api-zod/src
            git commit -m "chore: regenerate API clients for costs and expenses"
            git push origin HEAD:feat/costs-expenses-profitability
          fi
