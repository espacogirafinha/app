name: Invoice badge validation

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Confirm invoice badges are tied to NIF
        run: |
          grep -q 'event.nif?.trim()' artifacts/girafinha/src/pages/venue-events.tsx
          grep -q 'FATURA!' artifacts/girafinha/src/pages/venue-events.tsx
          grep -q 'event.nif?.trim()' artifacts/girafinha/src/pages/external-events.tsx
          grep -q 'FATURA!' artifacts/girafinha/src/pages/external-events.tsx
