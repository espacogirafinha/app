name: Inventory foundation validation

on:
  push:
    branches:
      - feat/inventory-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify API codegen is synchronized
        run: |
          corepack pnpm --filter @workspace/api-spec codegen
          git restore --source=HEAD -- lib/api-zod/src/index.ts lib/api-zod/src/generated/types/workshop.ts || true
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src
      - name: Inventory tests
        run: node --experimental-strip-types --test artifacts/api-server/src/lib/inventory-stock.test.ts
      - name: Existing regression tests
        run: node --experimental-strip-types --test artifacts/api-server/src/lib/event-payment-rules.test.ts artifacts/api-server/src/lib/reports-finance.test.ts artifacts/girafinha/src/components/event-extras-selector.test.ts artifacts/girafinha/src/lib/google-forms-review.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
