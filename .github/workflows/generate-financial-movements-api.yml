name: Generate financial movements API client

on:
  push:
    branches:
      - feat/financial-movements

permissions:
  contents: write

jobs:
  codegen:
    if: github.event.head_commit.message != 'chore: generate financial movements api client'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/financial-movements
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @workspace/api-spec codegen
      - name: Commit generated API files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/api-client-react/src/generated lib/api-zod/src/generated
          git commit -m "chore: generate financial movements api client"
          git push
