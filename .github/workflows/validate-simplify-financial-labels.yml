name: Validate simplified financial labels

on:
  push:
    branches:
      - feat/simplify-financial-labels

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --no-frozen-lockfile

      - name: API codegen consistency
        run: |
          corepack pnpm --filter @workspace/api-spec codegen
          git restore --source=HEAD -- lib/api-zod/src/index.ts lib/api-zod/src/generated/types/workshop.ts
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src

      - name: Cash flow unit tests
        run: |
          node --experimental-strip-types --test \
            artifacts/api-server/src/lib/reports-profitability.test.ts

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Start reports test app
        run: |
          PORT=4175 VITE_SUPABASE_URL=http://127.0.0.1:9999 VITE_SUPABASE_ANON_KEY=test-anon-key \
            corepack pnpm --filter @workspace/girafinha dev > /tmp/simplify-financial-labels-vite.log 2>&1 &
          echo $! > /tmp/simplify-financial-labels-vite.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4175/reports-extra-cost-test.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/simplify-financial-labels-vite.log
          exit 1

      - name: Reports financial labels browser integration
        run: corepack pnpm exec playwright test --config=playwright.reports-extra-cost.config.ts

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Build
        run: corepack pnpm run build

      - name: Stop reports test app
        if: always()
        run: |
          if [ -f /tmp/simplify-financial-labels-vite.pid ]; then kill $(cat /tmp/simplify-financial-labels-vite.pid) || true; fi
          cat /tmp/simplify-financial-labels-vite.log || true
