name: Reports extra cost fix validation

on:
  push:
    branches:
      - fix/reports-extra-cost-update

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      - name: Relevant tests
        run: |
          node --experimental-strip-types --test \
            artifacts/api-server/src/lib/selected-extra-cost.test.ts \
            artifacts/api-server/src/lib/selected-extra-cost-update.test.ts \
            artifacts/api-server/src/lib/selected-extra-cost-contract.test.ts \
            artifacts/api-server/src/lib/vercel-selected-extra-route.test.ts \
            artifacts/api-server/src/lib/reports-extras.test.ts \
            artifacts/api-server/src/lib/reports-finance.test.ts \
            artifacts/girafinha/src/lib/selected-extra-cost-error.test.ts \
            lib/api-client-react/src/custom-fetch.test.ts

      - name: Build API and prove PATCH route is bundled
        run: |
          corepack pnpm --filter @workspace/api-server build
          grep -F '"/selected-extras/:id"' artifacts/api-server/dist/app.mjs

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Start isolated local app
        run: |
          PORT=4174 VITE_SUPABASE_URL=http://127.0.0.1:9999 VITE_SUPABASE_ANON_KEY=test-anon-key \
            corepack pnpm --filter @workspace/girafinha dev > /tmp/reports-cost-fix-vite.log 2>&1 &
          echo $! > /tmp/reports-cost-fix-vite.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/reports-extra-cost-test.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/reports-cost-fix-vite.log
          exit 1

      - name: Reports browser integration
        run: corepack pnpm exec playwright test --config=playwright.reports-extra-cost.config.ts

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Build
        run: corepack pnpm run build

      - name: Stop isolated local app
        if: always()
        run: |
          if [ -f /tmp/reports-cost-fix-vite.pid ]; then kill $(cat /tmp/reports-cost-fix-vite.pid) || true; fi
          cat /tmp/reports-cost-fix-vite.log || true
