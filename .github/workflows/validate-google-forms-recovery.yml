name: Validate Google Forms recovery

on:
  push:
    branches:
      - fix/google-forms-import-recovery

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Google Forms integration tests
        run: node --experimental-strip-types --test artifacts/api-server/src/integrations/google-forms.test.ts
      - name: Google Forms review tests
        run: node --experimental-strip-types --test artifacts/api-server/src/integrations/google-forms-review.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Confirm Vercel function count
        run: |
          count=$(find api -type f -name '*.mjs' | wc -l | tr -d ' ')
          echo "Vercel function files: $count"
          test "$count" -le 12
