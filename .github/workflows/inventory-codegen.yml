name: Inventory codegen

on:
  push:
    branches:
      - feat/inventory-v1
    paths:
      - lib/api-spec/openapi.yaml
      - .github/workflows/inventory-codegen.yml

permissions:
  contents: write

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inventory-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @workspace/api-spec run codegen
      - name: Commit generated API clients
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "espacogirafinha"
          git config user.email "espacogirafinha@gmail.com"
          git add lib/api-client-react/src/generated lib/api-zod/src/generated
          git commit -m "chore: generate inventory API clients"
          git push origin HEAD:feat/inventory-v1
