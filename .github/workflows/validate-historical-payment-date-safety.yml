name: Validate historical payment date safety

on:
  push:
    branches:
      - fix/historical-payment-date-safety

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Payment UI unit tests
        run: node --experimental-strip-types --test artifacts/girafinha/src/lib/event-payment-ui.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Confirm Vercel function count
        run: |
          count=$(find api -type f -name '*.mjs' | wc -l | tr -d ' ')
          echo "Vercel function files: $count"
          test "$count" -le 12
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Start Girafinha test server
        env:
          PORT: "4175"
        run: |
          corepack pnpm --filter @workspace/girafinha dev >/tmp/girafinha-payments.log 2>&1 &
          echo $! >/tmp/girafinha-payments.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4175/event-payments-test.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/girafinha-payments.log
          exit 1
      - name: Payment date safety E2E
        run: corepack pnpm exec playwright test --config=playwright.event-payments.config.ts
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/girafinha-payments.pid ]; then kill $(cat /tmp/girafinha-payments.pid) || true; fi
          cat /tmp/girafinha-payments.log || true
