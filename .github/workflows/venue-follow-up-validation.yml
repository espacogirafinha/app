name: Venue Follow-up Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/venue-preparation-reactivation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
      - run: corepack pnpm install --frozen-lockfile
      - name: Unit tests
        run: node --experimental-strip-types --test artifacts/girafinha/src/lib/venue-follow-up.test.ts
      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Follow-up E2E desktop and mobile
        run: corepack pnpm exec playwright test --config=playwright.follow-up.config.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Archive E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: follow-up-e2e-results
          path: |
            test-results/
            playwright-follow-up-report/
          if-no-files-found: ignore
