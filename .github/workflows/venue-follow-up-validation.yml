name: Venue Follow-up Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/venue-preparation-reactivation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
      - run: corepack pnpm install --frozen-lockfile
      - name: Unit tests
        run: node --experimental-strip-types --test artifacts/girafinha/src/lib/venue-follow-up.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
