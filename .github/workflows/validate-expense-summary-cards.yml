name: Validate expense summary cards

on:
  push:
    branches:
      - feat/clickable-expense-summary-cards

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Confirm Vercel function count
        run: |
          count=$(find api -type f -name '*.mjs' | wc -l | tr -d ' ')
          echo "Vercel function files: $count"
          test "$count" -le 12
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Start Girafinha test server
        env:
          PORT: "4175"
        run: |
          corepack pnpm --filter @workspace/girafinha dev >/tmp/girafinha-expenses.log 2>&1 &
          echo $! >/tmp/girafinha-expenses.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4175/expenses-flow-test.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/girafinha-expenses.log
          exit 1
      - name: Existing expense E2E
        id: existing_e2e
        continue-on-error: true
        env:
          E2E_BASE_URL: http://127.0.0.1:4175
        run: corepack pnpm exec playwright test tests/e2e/expenses-flow.local.spec.ts --project=chromium --no-deps
      - name: Summary card E2E
        id: summary_e2e
        continue-on-error: true
        env:
          E2E_BASE_URL: http://127.0.0.1:4175
        run: corepack pnpm exec playwright test tests/e2e/expenses-summary-cards.local.spec.ts --project=chromium --no-deps
      - name: Verify expense E2E results
        run: |
          echo "existing=${{ steps.existing_e2e.outcome }}"
          echo "summary=${{ steps.summary_e2e.outcome }}"
          test "${{ steps.existing_e2e.outcome }}" = "success"
          test "${{ steps.summary_e2e.outcome }}" = "success"
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/girafinha-expenses.pid ]; then kill $(cat /tmp/girafinha-expenses.pid) || true; fi
          cat /tmp/girafinha-expenses.log || true
