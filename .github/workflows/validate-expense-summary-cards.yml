name: Validate expense summary cards

on:
  push:
    branches:
      - feat/clickable-expense-summary-cards

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Confirm Vercel function count
        run: |
          count=$(find api -type f -name '*.mjs' | wc -l | tr -d ' ')
          echo "Vercel function files: $count"
          test "$count" -le 12

  existing-expense-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium
      - name: Create unauthenticated local Playwright config
        run: |
          cat > playwright.expenses.config.mjs <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: './tests/e2e',
            outputDir: 'test-results/e2e',
            retries: 0,
            reporter: [['list'], ['html', { outputFolder: 'playwright-report', open: 'never' }]],
            use: {
              baseURL: process.env.E2E_BASE_URL,
              screenshot: 'only-on-failure',
              trace: 'retain-on-failure',
            },
            projects: [{ name: 'chromium-local', use: { ...devices['Desktop Chrome'] } }],
          });
          EOF
      - name: Start server
        env:
          PORT: "4175"
        run: |
          corepack pnpm --filter @workspace/girafinha dev >/tmp/girafinha-expenses.log 2>&1 &
          echo $! >/tmp/girafinha-expenses.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4175/expenses-flow-test.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/girafinha-expenses.log
          exit 1
      - name: Existing expense E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4175
        run: corepack pnpm exec playwright test tests/e2e/expenses-flow.local.spec.ts --config=playwright.expenses.config.mjs --project=chromium-local
      - name: Upload existing failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: existing-expense-failure
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: warn

  summary-card-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium
      - name: Create unauthenticated local Playwright config
        run: |
          cat > playwright.expenses.config.mjs <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: './tests/e2e',
            outputDir: 'test-results/e2e',
            retries: 0,
            reporter: [['list'], ['html', { outputFolder: 'playwright-report', open: 'never' }]],
            use: {
              baseURL: process.env.E2E_BASE_URL,
              screenshot: 'only-on-failure',
              trace: 'retain-on-failure',
            },
            projects: [{ name: 'chromium-local', use: { ...devices['Desktop Chrome'] } }],
          });
          EOF
      - name: Start server
        env:
          PORT: "4175"
        run: |
          corepack pnpm --filter @workspace/girafinha dev >/tmp/girafinha-expenses.log 2>&1 &
          echo $! >/tmp/girafinha-expenses.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4175/expenses-flow-test.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/girafinha-expenses.log
          exit 1
      - name: Summary card E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4175
        run: corepack pnpm exec playwright test tests/e2e/expenses-summary-cards.local.spec.ts --config=playwright.expenses.config.mjs --project=chromium-local
      - name: Upload summary failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: summary-card-failure
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: warn
