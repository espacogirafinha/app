name: Sync lock and validate financial labels

on:
  push:
    branches:
      - feat/simplify-financial-labels

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simplify-financial-labels
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Sync stale workspace lockfile
        id: sync
        run: |
          corepack pnpm install --lockfile-only --no-frozen-lockfile
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm lockfile with workspace"
          git push origin HEAD:feat/simplify-financial-labels
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Frozen install
        if: steps.sync.outputs.changed == 'false'
        run: corepack pnpm install --frozen-lockfile

      - name: API codegen consistency
        if: steps.sync.outputs.changed == 'false'
        run: |
          corepack pnpm --filter @workspace/api-spec codegen
          git restore --source=HEAD -- lib/api-zod/src/index.ts lib/api-zod/src/generated/types/workshop.ts
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src

      - name: Cash flow unit tests
        if: steps.sync.outputs.changed == 'false'
        run: |
          node --experimental-strip-types --test \
            artifacts/api-server/src/lib/reports-profitability.test.ts

      - name: Install Chromium
        if: steps.sync.outputs.changed == 'false'
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Start reports test app
        if: steps.sync.outputs.changed == 'false'
        run: |
          PORT=4175 VITE_SUPABASE_URL=http://127.0.0.1:9999 VITE_SUPABASE_ANON_KEY=test-anon-key \
            corepack pnpm --filter @workspace/girafinha dev > /tmp/simplify-financial-labels-vite.log 2>&1 &
          echo $! > /tmp/simplify-financial-labels-vite.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4175/reports-extra-cost-test.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/simplify-financial-labels-vite.log
          exit 1

      - name: Reports financial labels browser integration
        if: steps.sync.outputs.changed == 'false'
        run: corepack pnpm exec playwright test --config=playwright.reports-extra-cost.config.ts

      - name: Typecheck
        if: steps.sync.outputs.changed == 'false'
        run: corepack pnpm run typecheck

      - name: Build
        if: steps.sync.outputs.changed == 'false'
        run: corepack pnpm run build

      - name: Stop reports test app
        if: always()
        run: |
          if [ -f /tmp/simplify-financial-labels-vite.pid ]; then kill $(cat /tmp/simplify-financial-labels-vite.pid) || true; fi
          cat /tmp/simplify-financial-labels-vite.log || true

# lockfile-synced validation pass
