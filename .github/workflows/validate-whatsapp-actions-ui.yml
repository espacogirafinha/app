name: Validate WhatsApp actions UI

on:
  push:
    branches:
      - feat/whatsapp-booking-confirmation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/whatsapp-booking-confirmation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: WhatsApp unit tests
        run: node --experimental-strip-types --test artifacts/girafinha/src/lib/booking-confirmation-whatsapp.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Confirm Vercel function count
        run: |
          count=$(find api -type f -name '*.mjs' | wc -l | tr -d ' ')
          echo "Vercel function files: $count"
          test "$count" -le 12
      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Start payments harness
        run: |
          PORT=4175 VITE_SUPABASE_URL=https://example.supabase.co VITE_SUPABASE_ANON_KEY=test-anon \
            corepack pnpm --filter @workspace/girafinha dev > /tmp/girafinha-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/event-payments-test.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/girafinha-vite.log
          exit 1
      - name: Payments and WhatsApp E2E
        run: corepack pnpm exec playwright test --config=playwright.event-payments.config.ts
      - name: Upload WhatsApp actions preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-actions-preview
          path: test-results/whatsapp-buttons-preview.png
          if-no-files-found: ignore
