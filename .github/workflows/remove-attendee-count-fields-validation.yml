name: Remove attendee count fields validation

on:
  push:
    branches:
      - fix/remove-attendee-count-fields
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Confirm attendee counts are hidden from V2 UI
        run: |
          ! grep -q 'Nº crianças' artifacts/girafinha/src/components/venue-event-modal.tsx
          ! grep -q 'childrenCount} crianças' artifacts/girafinha/src/pages/venue-events.tsx
          ! grep -q 'Nº pessoas/convidados' artifacts/girafinha/src/components/external-event-modal.tsx
          ! grep -q 'guestCount} pessoas' artifacts/girafinha/src/pages/external-events.tsx
