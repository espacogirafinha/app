name: Validate WhatsApp actions in venue list

on:
  push:
    branches:
      - feat/whatsapp-booking-confirmation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/whatsapp-booking-confirmation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: WhatsApp unit tests
        run: node --experimental-strip-types --test artifacts/girafinha/src/lib/booking-confirmation-whatsapp.test.ts
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Build
        run: corepack pnpm run build
      - name: Confirm Vercel function count
        run: |
          count=$(find api -type f -name '*.mjs' | wc -l | tr -d ' ')
          echo "Vercel function files: $count"
          test "$count" -le 12
      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Payments WhatsApp E2E
        run: corepack pnpm exec playwright test --config=playwright.event-payments.config.ts
      - name: Venue list WhatsApp E2E
        run: corepack pnpm exec playwright test --config=playwright.venue-events-search.config.ts
      - name: Upload list previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-actions-list-previews
          path: |
            test-results/whatsapp-actions-list-desktop.png
            test-results/whatsapp-actions-list-mobile.png
          if-no-files-found: ignore
