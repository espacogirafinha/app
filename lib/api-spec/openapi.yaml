components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ServiceType:
      type: string
      enum: ["Festas no espaço", "Serviços externos", "Workshops"]

    ReservationType:
      type: string
      enum: [venue_party, external_service, workshop]

    ReservationStatus:
      type: string
      enum: [draft, confirmed, completed, cancelled]

    MessageTemplateModule:
      type: string
      enum:
        [
          venue_events,
          external_events,
          workshops,
          workshop_participants,
          general,
        ]
    MessageTemplateTriggerType:
      type: string
      enum:
        [
          confirmation,
          payment_request,
          payment_reminder,
          event_reminder,
          post_event,
          cancellation,
          custom,
        ]
    MessageTemplate:
      type: object
      required:
        [
          id,
          name,
          module,
          triggerType,
          body,
          isActive,
          sortOrder,
