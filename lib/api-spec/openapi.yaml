openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Espaço Girafinha reservation management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reservations
    description: Reservation management
  - name: venue-events
    description: Venue event management
  - name: external-events
    description: External event management
  - name: workshops
    description: Workshop and participant management
  - name: dashboard
    description: Dashboard and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /reservations:
    get:
      operationId: listReservations
      tags: [reservations]
      summary: List all reservations
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [paid, partial, unpaid]
        - name: serviceType
          in: query
          schema:
            $ref: "#/components/schemas/ServiceType"
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create a new reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationBody"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations/{id}:
    get:
      operationId: getReservation
      tags: [reservations]
      summary: Get a reservation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateReservation
      tags: [reservations]
      summary: Update a reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReservationBody"
      responses:
        "200":
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteReservation
      tags: [reservations]
      summary: Delete a reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /venue-events:
    get:
      operationId: listVenueEvents
      tags: [venue-events]
      summary: List venue events
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/VenueEventStatus"
        - name: paymentStatus
          in: query
          schema:
            $ref: "#/components/schemas/VenueEventPaymentStatus"
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of venue events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenueEvent"

    post:
      operationId: createVenueEvent
      tags: [venue-events]
      summary: Create a venue event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueEventBody"
      responses:
        "201":
          description: Venue event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueEvent"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /venue-events/{id}:
    get:
      operationId: getVenueEvent
      tags: [venue-events]
      summary: Get a venue event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateVenueEvent
      tags: [venue-events]
      summary: Update a venue event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenueEventBody"
      responses:
        "200":
          description: Updated venue event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteVenueEvent
      tags: [venue-events]
      summary: Delete a venue event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-events:
    get:
      operationId: listExternalEvents
      tags: [external-events]
      summary: List external events
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ExternalEventStatus"
        - name: paymentStatus
          in: query
          schema:
            $ref: "#/components/schemas/ExternalEventPaymentStatus"
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of external events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalEvent"

    post:
      operationId: createExternalEvent
      tags: [external-events]
      summary: Create an external event with services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExternalEventBody"
      responses:
        "201":
          description: External event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEvent"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-events/{id}:
    get:
      operationId: getExternalEvent
      tags: [external-events]
      summary: Get an external event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: External event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateExternalEvent
      tags: [external-events]
      summary: Update an external event and optionally replace services
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExternalEventBody"
      responses:
        "200":
          description: Updated external event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteExternalEvent
      tags: [external-events]
      summary: Delete an external event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workshops:
    get:
      operationId: listWorkshops
      tags: [workshops]
      summary: List workshops with participant aggregates
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WorkshopStatus"
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of workshops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workshop"

    post:
      operationId: createWorkshop
      tags: [workshops]
      summary: Create a workshop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkshopBody"
      responses:
        "201":
          description: Workshop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workshops/{id}:
    get:
      operationId: getWorkshop
      tags: [workshops]
      summary: Get a workshop by ID with participants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workshop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateWorkshop
      tags: [workshops]
      summary: Update a workshop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkshopBody"
      responses:
        "200":
          description: Updated workshop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteWorkshop
      tags: [workshops]
      summary: Delete a workshop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workshops/{id}/participants:
    post:
      operationId: createWorkshopParticipant
      tags: [workshops]
      summary: Add a participant to a workshop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkshopParticipantBody"
      responses:
        "201":
          description: Participant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopParticipant"
        "400":
          description: Invalid request or capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workshops/{id}/participants/{participantId}:
    patch:
      operationId: updateWorkshopParticipant
      tags: [workshops]
      summary: Update a workshop participant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkshopParticipantBody"
      responses:
        "200":
          description: Participant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopParticipant"
        "400":
          description: Invalid request or capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteWorkshopParticipant
      tags: [workshops]
      summary: Delete a workshop participant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard-v2:
    get:
      operationId: getDashboardV2
      tags: [dashboard]
      summary: Get V2 dashboard aggregate
      description: Aggregates venue events, external events, services, workshops and participants for the V2 dashboard.
      responses:
        "200":
          description: V2 dashboard aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardV2"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/upcoming:
    get:
      operationId: getUpcomingReservations
      tags: [dashboard]
      summary: Get upcoming reservations
      responses:
        "200":
          description: Upcoming reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

  /reservations/{id}/tasks:
    get:
      operationId: listTasks
      tags: [reservations]
      summary: List tasks for a reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

    post:
      operationId: createTask
      tags: [reservations]
      summary: Create a new task for a reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [reservations]
      summary: Update a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

    delete:
      operationId: deleteTask
      tags: [reservations]
      summary: Delete a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/summary:
    get:
      operationId: getTasksSummary
      tags: [reservations]
      summary: Get a summary of task progress for many reservations
      parameters:
        - name: reservationIds
          in: query
          required: true
          description: Comma-separated list of reservation IDs
          schema:
            type: string
      responses:
        "200":
          description: Task summaries indexed by reservation ID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskSummary"

  /reports:
    get:
      operationId: getReportsData
      tags: [dashboard]
      summary: Get reports and analytics data
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Reports data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsData"

  /dashboard/calendar:
    get:
      operationId: getCalendarReservations
      tags: [dashboard]
      summary: Get reservations grouped by date for calendar view
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Calendar data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarDay"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ServiceType:
      type: string
      enum: ["Festas no espaço", "Serviços externos", "Workshops"]

    ReservationType:
      type: string
      enum: [venue_party, external_service, workshop]

    ReservationStatus:
      type: string
      enum: [draft, confirmed, completed, cancelled]

    VenueEventStatus:
      type: string
      enum: [draft, confirmed, completed, cancelled]

    VenueEventPaymentStatus:
      type: string
      enum: [unpaid, partial, paid]

    VenueEventImageAuthorization:
      type: string
      enum: [rosto_visivel, rosto_tapado, nao_autorizo]

    ExternalEventStatus:
      type: string
      enum: [draft, confirmed, completed, cancelled]

    ExternalEventPaymentStatus:
      type: string
      enum: [unpaid, partial, paid]

    ExternalEventServiceType:
      type: string
      enum: [decoracao, catering, organizacao_evento, animacao, insuflavel, baloes, outro]

    ExternalEventServiceStatus:
      type: string
      enum: [planned, in_progress, completed, cancelled]

    WorkshopStatus:
      type: string
      enum: [draft, open, full, completed, cancelled]

    WorkshopParticipantStatus:
      type: string
      enum: [registered, confirmed, attended, cancelled]

    WorkshopParticipantPaymentStatus:
      type: string
      enum: [unpaid, partial, paid]

    Reservation:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        phone:
          type: string
        eventDate:
          type: string
        eventTime:
          type: string
        pack:
          type: string
          enum: ["Aluguer do Espaço", "Pack Simples", "Pack com Decoração", "Pack Completo", "Decoração Externa", "Catering / Brunch", "Animação", "Aluguer de Insuflável", "Workshop Balões Nível 1", "Workshop Balões + Kit Inicial", "Só Espaço", "Espaço + Lanche", "Espaço + Decoração"]
        serviceType:
          $ref: "#/components/schemas/ServiceType"
        numChildren:
          type: integer
        childrenAges:
          type: string
        extras:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        totalPrice:
          type: number
        amountPaid:
          type: number
        reservationType:
          $ref: "#/components/schemas/ReservationType"
        customerEmail:
          type: ["string", "null"]
        customerNif:
          type: ["string", "null"]
        paymentMethod:
          type: ["string", "null"]
        reservationSource:
          type: ["string", "null"]
        reservationStatus:
          $ref: "#/components/schemas/ReservationStatus"
        birthdayChildName:
          type: ["string", "null"]
        birthdayChildAge:
          type: ["integer", "null"]
        partyTheme:
          type: ["string", "null"]
        decorationNotes:
          type: ["string", "null"]
        cateringOption:
          type: ["string", "null"]
        allergies:
          type: ["string", "null"]
        imageAuthorization:
          oneOf:
            - type: string
              enum: [rosto_visivel, rosto_tapado, nao_autorizo]
            - type: "null"
        termsAccepted:
          type: ["boolean", "null"]
        eventLocation:
          type: ["string", "null"]
        guestCount:
          type: ["integer", "null"]
        eventType:
          type: ["string", "null"]
        eventTheme:
          type: ["string", "null"]
        externalServiceNotes:
          type: ["string", "null"]
        workshopName:
          type: ["string", "null"]
        participantCount:
          type: ["integer", "null"]
        workshopNotes:
          type: ["string", "null"]
        remainingBalance:
          type: number
        paymentStatus:
          type: string
          enum: [paid, partial, unpaid]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - customerName
        - phone
        - eventDate
        - eventTime
        - pack
        - serviceType
        - numChildren
        - childrenAges
        - totalPrice
        - amountPaid
        - remainingBalance
        - paymentStatus
        - createdAt
        - updatedAt

    CreateReservationBody:
      type: object
      properties:
        customerName:
          type: string
        phone:
          type: string
        eventDate:
          type: string
        eventTime:
          type: string
        pack:
          type: string
          enum: ["Aluguer do Espaço", "Pack Simples", "Pack com Decoração", "Pack Completo", "Decoração Externa", "Catering / Brunch", "Animação", "Aluguer de Insuflável", "Workshop Balões Nível 1", "Workshop Balões + Kit Inicial", "Só Espaço", "Espaço + Lanche", "Espaço + Decoração"]
        serviceType:
          $ref: "#/components/schemas/ServiceType"
        numChildren:
          type: integer
        childrenAges:
          type: string
        extras:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        totalPrice:
          type: number
        amountPaid:
          type: number
        reservationType:
          $ref: "#/components/schemas/ReservationType"
        customerEmail:
          type: ["string", "null"]
        customerNif:
          type: ["string", "null"]
        paymentMethod:
          type: ["string", "null"]
        reservationSource:
          type: ["string", "null"]
        reservationStatus:
          $ref: "#/components/schemas/ReservationStatus"
        birthdayChildName:
          type: ["string", "null"]
        birthdayChildAge:
          type: ["integer", "null"]
        partyTheme:
          type: ["string", "null"]
        decorationNotes:
          type: ["string", "null"]
        cateringOption:
          type: ["string", "null"]
        allergies:
          type: ["string", "null"]
        imageAuthorization:
          oneOf:
            - type: string
              enum: [rosto_visivel, rosto_tapado, nao_autorizo]
            - type: "null"
