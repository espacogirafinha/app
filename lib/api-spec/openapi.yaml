openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: EspaÃ§o Girafinha reservation management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reservations
    description: Reservation management
  - name: venue-events
    description: Venue event management
  - name: external-events
    description: External event management
  - name: workshops
    description: Workshop and participant management
  - name: settings-catalogs
    description: Operational settings catalogs
  - name: dashboard
    description: Dashboard and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /reservations:
    get:
      operationId: listReservations
      tags: [reservations]
      summary: List all reservations
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [paid, partial, unpaid]
        - name: serviceType
          in: query
          schema:
            $ref: "#/components/schemas/ServiceType"
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

    post:
      operationId: createReservation
      tags: [reservations]
      summary: Create a new reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationBody"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations/{id}:
    get:
      operationId: getReservation
      tags: [reservations]
      summary: Get a reservation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateReservation
      tags: [reservations]
      summary: Update a reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReservationBody"
      responses:
        "200":
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteReservation
      tags: [reservations]
      summary: Delete a reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /venue-events:
    get:
      operationId: listVenueEvents
      tags: [venue-events]
      summary: List venue events
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/VenueEventStatus"
        - name: paymentStatus
          in: query
          schema:
            $ref: "#/components/schemas/VenueEventPaymentStatus"
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of venue events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenueEvent"

    post:
      operationId: createVenueEvent
      tags: [venue-events]
      summary: Create a venue event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueEventBody"
      responses:
        "201":
          description: Venue event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueEvent"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /venue-events/{id}:
    get:
      operationId: getVenueEvent
      tags: [venue-events]
      summary: Get a venue event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Venue event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateVenueEvent
      tags: [venue-events]
      summary: Update a venue event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenueEventBody"
      responses:
        "200":
          description: Updated venue event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteVenueEvent
      tags: [venue-events]
      summary: Delete a venue event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-events:
    get:
      operationId: listExternalEvents
      tags: [external-events]
      summary: List external events
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ExternalEventStatus"
        - name: paymentStatus
          in: query
          schema:
            $ref: "#/components/schemas/ExternalEventPaymentStatus"
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of external events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalEvent"

    post:
      operationId: createExternalEvent
      tags: [external-events]
      summary: Create an external event with services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExternalEventBody"
      responses:
        "201":
          description: External event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEvent"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-events/{id}:
    get:
      operationId: getExternalEvent
      tags: [external-events]
      summary: Get an external event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: External event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateExternalEvent
      tags: [external-events]
      summary: Update an external event and optionally replace services
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExternalEventBody"
      responses:
        "200":
          description: Updated external event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteExternalEvent
      tags: [external-events]
      summary: Delete an external event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workshops:
    get:
      operationId: listWorkshops
      tags: [workshops]
      summary: List workshops with participant aggregates
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WorkshopStatus"
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of workshops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workshop"

    post:
      operationId: createWorkshop
      tags: [workshops]
      summary: Create a workshop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkshopBody"
      responses:
        "201":
          description: Workshop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workshops/{id}:
    get:
      operationId: getWorkshop
      tags: [workshops]
      summary: Get a workshop by ID with participants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Workshop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateWorkshop
      tags: [workshops]
      summary: Update a workshop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkshopBody"
      responses:
        "200":
          description: Updated workshop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteWorkshop
      tags: [workshops]
      summary: Delete a workshop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workshops/{id}/participants:
    post:
      operationId: createWorkshopParticipant
      tags: [workshops]
      summary: Add a participant to a workshop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkshopParticipantBody"
      responses:
        "201":
          description: Participant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopParticipant"
        "400":
          description: Invalid request or capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workshops/{id}/participants/{participantId}:
    patch:
      operationId: updateWorkshopParticipant
      tags: [workshops]
      summary: Update a workshop participant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkshopParticipantBody"
      responses:
        "200":
          description: Participant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopParticipant"
        "400":
          description: Invalid request or capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteWorkshopParticipant
      tags: [workshops]
      summary: Delete a workshop participant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /selected-extras:
    get:
      operationId: listSelectedExtras
      tags: [selected-extras]
      summary: List selected extras for an event
      parameters:
        - name: module
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SelectedExtraModule"
        - name: entityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Selected extras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelectedExtra"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: replaceSelectedExtras
      tags: [selected-extras]
      summary: Replace the full selected extras list for an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceSelectedExtrasBody"
      responses:
        "200":
          description: Replaced selected extras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelectedExtra"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings/venue-packs:
    get:
      operationId: listVenuePacks
      tags: [settings-catalogs]
      summary: List venue packs
      responses:
        "200":
          description: List of venue packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenuePack"

    post:
      operationId: createVenuePack
      tags: [settings-catalogs]
      summary: Create a venue pack
      description: Creates a venue pack. If `id` is provided in the body, updates that venue pack instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenuePackBody"
      responses:
        "201":
          description: Venue pack created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePack"
        "200":
          description: Venue pack updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePack"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings/venue-packs/{id}:
    patch:
      operationId: updateVenuePack
      tags: [settings-catalogs]
      summary: Update a venue pack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenuePackBody"
      responses:
        "200":
          description: Venue pack updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePack"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings/external-services:
    get:
      operationId: listExternalServices
      tags: [settings-catalogs]
      summary: List external service catalog items
      responses:
        "200":
          description: List of external service catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalServiceCatalog"

    post:
      operationId: createExternalService
      tags: [settings-catalogs]
      summary: Create an external service catalog item
      description: Creates an external service catalog item. If `id` is provided in the body, updates that service instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExternalServiceBody"
      responses:
        "201":
          description: External service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalServiceCatalog"
        "200":
          description: External service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalServiceCatalog"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings/external-services/{id}:
    patch:
      operationId: updateExternalService
      tags: [settings-catalogs]
      summary: Update an external service catalog item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExternalServiceBody"
      responses:
        "200":
          description: External service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalServiceCatalog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings/event-extras:
    get:
      operationId: listEventExtras
      tags: [settings-catalogs]
      summary: List event extras
      responses:
        "200":
          description: List of event extras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventExtra"

    post:
      operationId: createEventExtra
      tags: [settings-catalogs]
      summary: Create an event extra
      description: Creates an event extra. If `id` is provided in the body, updates that extra instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventExtraBody"
      responses:
        "201":
          description: Event extra created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventExtra"
        "200":
          description: Event extra updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventExtra"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings/event-extras/{id}:
    patch:
      operationId: updateEventExtra
      tags: [settings-catalogs]
      summary: Update an event extra
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventExtraBody"
      responses:
        "200":
          description: Event extra updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventExtra"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /settings/message-templates:
    get:
      operationId: listMessageTemplates
      summary: List message templates
      tags:
        - Settings
      responses:
        "200":
          description: Message templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageTemplate"
    post:
      operationId: createMessageTemplate
      summary: Create or update a message template
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageTemplateBody"
      responses:
        "201":
          description: Message template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageTemplate"
        "200":
          description: Message template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageTemplate"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard-v2:
    get:
      operationId: getDashboardV2
      tags: [dashboard]
      summary: Get V2 dashboard aggregate
      description: Aggregates venue events, external events, services, workshops and participants for the V2 dashboard.
      responses:
        "200":
          description: V2 dashboard aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardV2"

  /calendar-v2:
    get:
      operationId: getCalendarV2
      tags: [dashboard]
      summary: Get V2 calendar aggregate
      description: Aggregates V2 venue events, external events, workshops and participants for the operational calendar.
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: endDate
          in: query
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      responses:
        "200":
          description: V2 calendar aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarV2"
        "400":
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports-v2:
    get:
      operationId: getReportsV2
      tags: [dashboard]
      summary: Get V2 reports aggregate
      description: Aggregates V2 venue events, external events, services, workshops and participants for business reports.
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: endDate
          in: query
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      responses:
        "200":
          description: V2 reports aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsV2"
        "400":
          description: Invalid date range
          content:
            application/json:
